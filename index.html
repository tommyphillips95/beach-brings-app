<title>Beach Brings — The coast, delivered.</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* FONTS — cross-platform stack */
body{
  font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,Roboto,'Helvetica Neue',Arial,sans-serif;
  background:#F8F2E4;overflow:hidden;color:#2C3E40;
}

/* APP — bright sandy white base */
#app{
  max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;position:relative;
  background:linear-gradient(180deg,#FBF6E8 0%,#F8F2E4 40%,#F4ECDA 80%,#EFE6CE 100%);
  overflow:hidden;
}
#app::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.3;
  background-image:
    radial-gradient(circle at 18% 30%,rgba(160,140,90,.13) 1px,transparent 2px),
    radial-gradient(circle at 65% 75%,rgba(160,140,90,.09) 1px,transparent 2px),
    radial-gradient(circle at 85% 15%,rgba(160,140,90,.11) 1px,transparent 2px),
    radial-gradient(circle at 35% 90%,rgba(160,140,90,.09) 1px,transparent 2px),
    radial-gradient(circle at 75% 50%,rgba(160,140,90,.12) 1px,transparent 2px);
  background-size:40px 40px,55px 55px,60px 60px,45px 45px,50px 50px;
}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:78px;-webkit-overflow-scrolling:touch;position:relative;z-index:2}

.brush,.steel{
  background:linear-gradient(135deg,rgba(255,255,255,.6) 0%,rgba(248,242,228,.7) 50%,rgba(255,255,255,.6) 100%);
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);position:relative;
}
.glow{box-shadow:0 0 0 1px rgba(74,156,184,.18),0 4px 18px rgba(74,156,184,.1),inset 0 1px 0 rgba(255,255,255,.6);}

/* BOTTOM NAV — watery blue accent */
#bnav{
  position:absolute;bottom:0;left:0;right:0;height:74px;
  background:linear-gradient(180deg,rgba(255,255,255,.7) 0%,rgba(248,242,228,.85) 100%);
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  border-top:1px solid rgba(74,156,184,.2);
  display:flex;align-items:center;justify-content:space-around;padding-bottom:10px;z-index:100;
  box-shadow:0 -4px 20px rgba(74,156,184,.08);
}
.nb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;cursor:pointer;border:none;background:none;color:#7A8B8A;font-size:10px;font-weight:500;font-family:inherit;position:relative;transition:all .2s;letter-spacing:.2px}
.nb.on{color:#1B3A52}
.nb.on::after{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:24px;height:2px;background:linear-gradient(90deg,transparent,#4A9CB8,transparent);border-radius:2px}
.nb svg{width:22px;height:22px;stroke-width:1.8}
.cb{position:absolute;top:0px;right:-2px;background:linear-gradient(135deg,#C25E1F,#9A4214);color:white;font-size:9px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 2px 6px rgba(154,66,20,.3)}

.hdr{padding:18px 18px 0;color:#2C3E40;position:relative;overflow:hidden;z-index:2}

/* SEARCH BAR */
.sbar{background:rgba(255,255,255,.75);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);border:1px solid rgba(74,156,184,.22);border-radius:12px;display:flex;align-items:center;padding:0 14px;gap:10px;height:44px;margin:14px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 8px rgba(74,156,184,.06)}
.sbar input{border:none;outline:none;flex:1;font-size:14px;color:#2C3E40;font-family:inherit;background:none;font-weight:500}
.sbar input::placeholder{color:#8A9D9C}

/* SECTIONS */
.sec{padding:18px 18px 0;position:relative;z-index:2}
.sth{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.stit{font-size:15px;font-weight:600;color:#1B3A52;letter-spacing:-.2px}
.slnk{font-size:11px;color:#4A9CB8;font-weight:500;cursor:pointer;letter-spacing:.5px;text-transform:uppercase}

/* CATEGORY GRID */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ci{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.cico{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:linear-gradient(135deg,#FFFFFF 0%,#F8F2E4 100%);backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);border:1px solid rgba(74,156,184,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 8px rgba(74,156,184,.07);position:relative;overflow:hidden}
.cico::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent);pointer-events:none}
.ci:active .cico{transform:scale(.92);box-shadow:0 0 0 2px #4A9CB8,inset 0 1px 0 rgba(255,255,255,.6)}
.clbl{font-size:11px;font-weight:500;color:#2C3E40;text-align:center;line-height:1.2;letter-spacing:0}

/* PRODUCT CARDS */
.pcard{background:linear-gradient(135deg,#FFFFFF 0%,#FBF7EA 100%);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(74,156,184,.18);border-radius:14px;padding:14px;display:flex;align-items:center;gap:13px;margin:0 18px 10px;box-shadow:0 2px 8px rgba(74,156,184,.06),inset 0 1px 0 rgba(255,255,255,.6);position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(180deg,#4A9CB8,#1B3A52);opacity:.75}

.pico{
  font-size:0 !important;
  width:64px !important;height:64px !important;
  border-radius:12px !important;
  background:linear-gradient(135deg,#FFFFFF 0%,#F4ECDA 100%) !important;
  border:1px solid rgba(74,156,184,.18) !important;
  display:flex !important;align-items:center !important;justify-content:center !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 3px rgba(74,156,184,.05) !important;
  position:relative;overflow:hidden;flex-shrink:0;
}
.pico svg{width:36px;height:36px;position:relative;z-index:2}
.pico::after{content:'';position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(180deg,transparent,rgba(239,230,206,.4));pointer-events:none}

.pinfo{flex:1;min-width:0}
.pname{font-size:14px;font-weight:600;color:#2C3E40;margin-bottom:3px;letter-spacing:0}
.pmeta{font-size:11px;color:#7A8B8A;margin-bottom:4px;font-weight:500}
.ppr{font-size:14px;font-weight:700;color:#1B3A52;letter-spacing:0}

/* QUANTITY */
.qc{display:flex;align-items:center;gap:7px;flex-shrink:0}
.qb{width:32px;height:32px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;font-family:inherit;transition:all .15s}
.qb:active{transform:scale(.88)}
.qa{background:linear-gradient(135deg,#4A9CB8,#1B3A52);color:white;box-shadow:0 2px 6px rgba(27,58,82,.2),inset 0 1px 0 rgba(255,255,255,.15)}
.qr{background:rgba(255,255,255,.8);color:#4A9CB8;border:1px solid rgba(74,156,184,.35)}
.qn{font-size:15px;font-weight:600;color:#2C3E40;min-width:20px;text-align:center}

/* BUTTONS */
.bkb{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);border:1px solid rgba(74,156,184,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#4A9CB8;flex-shrink:0}
.btn{background:linear-gradient(135deg,#C25E1F 0%,#9A4214 100%);color:white;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:600;width:100%;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:12px;letter-spacing:0;text-transform:none;box-shadow:0 4px 12px rgba(194,94,31,.25),inset 0 1px 0 rgba(255,255,255,.2)}
.btn:active{opacity:.9;transform:scale(.98)}
.btn-secondary{background:rgba(255,255,255,.78);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);border:1px solid rgba(74,156,184,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 6px rgba(74,156,184,.06);color:#1B3A52;font-weight:500;text-transform:none}

/* CART SUMMARY */
.csumm{margin:0 18px 18px;background:linear-gradient(135deg,#FFFFFF 0%,#FBF7EA 100%);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-radius:16px;padding:20px;border:1px solid rgba(74,156,184,.22);box-shadow:0 4px 14px rgba(74,156,184,.06),inset 0 1px 0 rgba(255,255,255,.6)}
.srow{display:flex;justify-content:space-between;font-size:13px;color:#5A6B6A;margin-bottom:11px;align-items:center;font-weight:500}
.srow.tot{font-size:16px;font-weight:700;color:#1B3A52;border-top:1px solid rgba(74,156,184,.22);padding-top:14px;margin-top:6px;margin-bottom:0;letter-spacing:0}

.prow{background:linear-gradient(135deg,rgba(74,156,184,.1),rgba(74,156,184,.05));border:1px solid rgba(74,156,184,.22);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:8px;margin:0 18px 12px}

/* HERO BANNER — watery blue gradient */
.fban{margin:18px 18px 0;background:linear-gradient(135deg,#4A9CB8 0%,#1B3A52 100%);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:20px;color:#FFFFFF;display:flex;justify-content:space-between;align-items:center;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(27,58,82,.18),inset 0 1px 0 rgba(255,255,255,.1)}
.fban::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 90% 50%,rgba(255,255,255,.18),transparent 60%);pointer-events:none}

/* ORDER TRACKING */
.ocard{background:linear-gradient(135deg,#FFFFFF 0%,#FBF7EA 100%);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(74,156,184,.22);border-radius:16px;padding:22px;margin-bottom:14px;box-shadow:0 4px 14px rgba(74,156,184,.06),inset 0 1px 0 rgba(255,255,255,.6)}

/* TIP BUTTONS */
.tipb{flex:1;padding:12px 4px;border-radius:11px;border:1px solid rgba(74,156,184,.25);background:rgba(255,255,255,.65);backdrop-filter:blur(8px);color:#5A6B6A;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.tipb.sel{border-color:#4A9CB8;background:linear-gradient(135deg,#4A9CB8,#1B3A52);color:#FFFFFF;box-shadow:0 2px 8px rgba(74,156,184,.25)}

/* MAP */
.mapBox{position:relative;height:240px;border-radius:14px;overflow:hidden;border:1px solid rgba(74,156,184,.25);background:#6BB0CA;box-shadow:inset 0 0 30px rgba(74,156,184,.1)}
.mapBox::before{display:none}
.pin{position:absolute;width:28px;height:36px;cursor:pointer;transition:transform .2s}
.pin:active{transform:scale(.85)}

.input{width:100%;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);border:1px solid rgba(74,156,184,.25);border-radius:10px;padding:12px 14px;color:#2C3E40;font-size:14px;font-family:inherit;outline:none;transition:all .2s;font-weight:500}
.input:focus{border-color:#4A9CB8;box-shadow:0 0 0 3px rgba(74,156,184,.15)}
.input::placeholder{color:#8A9D9C}
.label{font-size:10px;font-weight:600;color:#5A6B6A;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px;display:block}

/* TABS */
.tabs{display:flex;gap:8px;padding:0 18px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 16px;border-radius:11px;background:rgba(255,255,255,.65);backdrop-filter:blur(8px);border:1px solid rgba(74,156,184,.18);color:#5A6B6A;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s;font-family:inherit}
.tab.act{background:linear-gradient(135deg,#4A9CB8,#1B3A52);border-color:#1B3A52;color:#FFFFFF;box-shadow:0 2px 8px rgba(74,156,184,.25)}

/* DRIVER MODE TOGGLE */
.toggle-mode{display:flex;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border:1px solid rgba(74,156,184,.22);border-radius:12px;padding:4px;margin:0 18px 14px}
.toggle-mode button{flex:1;padding:9px;border:none;background:none;color:#5A6B6A;font-size:12px;font-weight:600;cursor:pointer;border-radius:9px;font-family:inherit;letter-spacing:.4px;transition:all .2s}
.toggle-mode button.act{background:linear-gradient(135deg,#4A9CB8,#1B3A52);color:white;box-shadow:0 2px 8px rgba(74,156,184,.25)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 2s infinite}

.rest{background:linear-gradient(135deg,#FFFFFF 0%,#FBF7EA 100%);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);border:1px solid rgba(74,156,184,.18);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:center}

.promo{background:linear-gradient(135deg,rgba(194,94,31,.13),rgba(154,66,20,.05));border:1px dashed rgba(194,94,31,.42);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}

.logo{background:linear-gradient(135deg,#4A9CB8 0%,#1B3A52 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;letter-spacing:-.4px}
</style></head><body>

function renderQR(){
  const url = localStorage.getItem('bb_app_url') || 'https://beachbrings.com/';
  const target = document.getElementById('qr-target');
  if (!target) return;
  if (typeof qrcode === 'undefined') {
    target.innerHTML = '<span style="color:#C25E1F;font-size:12px">QR library failed to load. Offline?</span>';
    return;
  }
  try {
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    target.innerHTML = qr.createSvgTag({ scalable: true, cellSize: 8, margin: 2 });
    const svg = target.querySelector('svg');
    if (svg) { svg.style.width = '240px'; svg.style.height = '240px'; }
  } catch(e) {
    target.innerHTML = '<span style="color:#C25E1F;font-size:11px">' + e + '</span>';
  }
}

function copyLink(){
  const url = localStorage.getItem('bb_app_url') || 'https://beachbrings.com/';
  try {
    navigator.clipboard.writeText(url);
    alert('Link copied: ' + url);
  } catch(e) { prompt('Copy this:', url); }
}

function shareNative(){
  const url = localStorage.getItem('bb_app_url') || 'https://beachbrings.com/';
  if (navigator.share) {
    navigator.share({ title: 'Beach Brings', text: 'The coast, delivered. Order on the sand.', url });
  } else {
    copyLink();
  }
}

}
